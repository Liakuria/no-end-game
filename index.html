<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>冒険者タウン＆ダンジョン放置</title>
  <style>
    :root {
      --bg: #0f1016;
      --panel: #181a26;
      --border: #2a2e43;
      --accent: #ff6b6b;
      --accent-hover: #ff5252;
      --text: #f0f2f5;
      --text-sub: #9ba1a6;
      --gold: #ffd700;
      --wood: #a0522d;
      --stone: #708090;
      --soul: #9932cc;
    }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    /* リソース表示バー */
    .resource-bar {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      background: rgba(0,0,0,0.3);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 0.9rem;
      border: 1px solid var(--border);
    }
    .res-item { display: flex; justify-content: space-between; }
    .res-gold { color: var(--gold); }
    .res-wood { color: var(--wood); }
    .res-stone { color: var(--stone); }
    .res-soul { color: var(--soul); }

    /* タブ切り替え */
    .tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 15px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 5px;
      overflow-x: auto;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      padding: 8px 12px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 6px;
      white-space: nowrap;
      transition: 0.2s;
    }
    .tab-btn.active {
      background: var(--accent);
      color: white;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ボタン・カード */
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { background: #444; color: #888; cursor: not-allowed; }

    .card-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    /* 街グリッド */
    .town-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 15px;
    }
    .building-slot {
      background: rgba(0,0,0,0.2);
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }
    .building-slot.built {
      border: 2px solid var(--accent);
      background: rgba(255, 107, 107, 0.05);
    }

    /* 戦闘タブ */
    .battle-screen { text-align: center; padding: 15px 0; }
    .enemy-box {
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.05s;
    }
    .enemy-box:active { transform: scale(0.98); }
    .hp-bar-bg {
      background: #333;
      height: 16px;
      border-radius: 8px;
      overflow: hidden;
      margin: 10px 0;
    }
    .hp-bar-fill {
      background: #ff4757;
      height: 100%;
      width: 100%;
      transition: width 0.1s linear;
    }

    /* リスト要素 */
    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: rgba(0,0,0,0.2);
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 0.85rem;
    }

    .system-footer {
      margin-top: 20px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 資源バー -->
  <div class="resource-bar">
    <div class="res-item"><span>ゴールド:</span> <span id="res-gold" class="res-gold">0</span></div>
    <div class="res-item"><span>木材:</span> <span id="res-wood" class="res-wood">0</span></div>
    <div class="res-item"><span>鉱石:</span> <span id="res-stone" class="res-stone">0</span></div>
    <div class="res-item"><span>ソウル:</span> <span id="res-soul" class="res-soul">0</span></div>
  </div>

  <!-- タブボタン -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('town')">🏢 街</button>
    <button class="tab-btn" onclick="switchTab('battle')">⚔️ 戦闘</button>
    <button class="tab-btn" onclick="switchTab('research')">🔬 研究</button>
    <button class="tab-btn" onclick="switchTab('gacha')">🎰 ガチャ・編成</button>
    <button class="tab-btn" onclick="switchTab('reincarnation')">🔄 転生</button>
  </div>

  <!-- 1. 街タブ -->
  <div id="tab-town" class="tab-content active">
    <div class="card-box" style="text-align: center;">
      <h3>ギルド本部 (メインタップ)</h3>
      <p style="font-size: 0.85rem; color: var(--text-sub);">クリック効果: +1 ゴールド</p>
      <button onclick="tapGuild()" style="padding: 10px 20px;">ゴールド獲得！</button>
    </div>

    <h3>タウン建築 (敷地: <span id="town-size">3</span>x<span id="town-size-2">3</span>)</h3>
    <div class="town-grid" id="town-grid"></div>
    
    <div id="land-expand-box" style="text-align: center; margin-bottom: 15px;">
      <button onclick="expandLand()">土地を拡張する (コスト: <span id="land-cost">500</span>G)</button>
    </div>
  </div>

  <!-- 2. 戦闘タブ -->
  <div id="tab-battle" class="tab-content">
    <div class="battle-screen">
      <div id="stage-info" style="font-weight: bold; margin-bottom: 5px;">ステージ 1</div>
      <div class="enemy-box" onclick="attackEnemy()">
        <h3 id="enemy-name" style="margin:0;">スライム</h3>
        <div class="hp-bar-bg">
          <div id="enemy-hp-fill" class="hp-bar-fill"></div>
        </div>
        <div>HP: <span id="enemy-hp">10</span> / <span id="enemy-max-hp">10</span></div>
        <p style="font-size: 0.8rem; color: var(--text-sub); margin: 5px 0 0 0;">(タップで攻撃！)</p>
      </div>
      <div class="card-box" style="text-align: left;">
        <div><b>パーティ攻撃力:</b> <span id="battle-atk">1</span></div>
        <div><b>撃破時時短量:</b> <span id="stat-shikantime">1</span> 秒 / 1体</div>
      </div>
    </div>
  </div>

  <!-- 3. 研究タブ -->
  <div id="tab-research" class="tab-content">
    <h3>テックツリー研究</h3>
    <p style="font-size: 0.85rem; color: var(--text-sub);">研究スロット: <span id="research-slots">1</span> / <span id="research-max-slots">1</span> 稼働中</p>
    <div id="research-list"></div>
  </div>

  <!-- 4. ガチャ・編成タブ -->
  <div id="tab-gacha" class="tab-content">
    <div class="card-box" style="text-align: center;">
      <h3>冒険者スカウト (ガチャ)</h3>
      <p style="font-size: 0.85rem;">コスト: 100 ソウル</p>
      <button onclick="pullGacha()">仲間をスカウトする</button>
    </div>
    <h3>所有キャラクター一覧</h3>
    <div id="owned-char-list"></div>
  </div>

  <!-- 5. 転生タブ -->
  <div id="tab-reincarnation" class="tab-content">
    <div class="card-box" style="text-align: center;">
      <h3>転生（プレステージ）</h3>
      <p style="font-size: 0.85rem; color: var(--text-sub);">進行度をリセットして転生Ptを獲得します。</p>
      <p>獲得予定Pt: <span id="pending-reincarnate-pt" style="color:var(--gold); font-weight:bold;">0</span> Pt</p>
      <button onclick="reincarnate()" style="background: #9932cc;">転生を実行する</button>
    </div>
    <h3>転生アップグレード (永続強化)</h3>
    <div id="reincarnate-upgrades"></div>
  </div>

  <!-- フッター -->
  <div class="system-footer">
    <button onclick="saveGame()" style="background:#2ecc71;">セーブ</button>
    <button onclick="resetGame()" style="background:#e74c3c;">リセット</button>
  </div>
</div>

<script>
  let game = {
    gold: 0,
    wood: 0,
    stone: 0,
    soul: 0,
    townLevel: 3,
    buildings: {},
    enemyMaxHp: 10,
    enemyHp: 10,
    stage: 1,
    researches: {},
    activeResearches: [],
    characters: [
      { id: 'hero', name: '見習い剣士 (メイン)', atk: 1, owned: true }
    ],
    reincarnatePoints: 0,
    upgrades: {
      shikaiSpeed: 0,
      offlineMaxTime: 0
    },
    lastSaveTime: Date.now()
  };

  const BUILDING_TYPES = {
    gold_mine: { name: '金鉱', baseCost: {gold: 50}, goldGen: 2, unit: 'ゴールド/秒' },
    lumber_mill: { name: '伐採所', baseCost: {gold: 100}, woodGen: 1, unit: '木材/秒' },
    quarry: { name: '採掘所', baseCost: {gold: 200, wood: 50}, stoneGen: 1, unit: '鉱石/秒' },
    lab: { name: '研究所', baseCost: {gold: 500, stone: 100}, labEffect: 1, unit: '研究枠追加' }
  };

  const RESEARCH_DATA = [
    { id: 'res_atk1', name: '剣術強化 I', time: 30, cost: {gold: 200}, desc: '攻撃力 +2' },
    { id: 'res_slot1', name: '研究室拡張', time: 60, cost: {gold: 500, wood: 100}, desc: '同時研究枠 +1' },
    { id: 'res_atk2', name: '剣術強化 II', time: 120, cost: {gold: 2000, stone: 300}, desc: '攻撃力 +5' }
  ];

  const GACHA_POOL = [
    { name: '見習い魔導士', atk: 3 },
    { name: 'エルフの弓使い', atk: 5 },
    { name: '重騎士', atk: 8 }
  ];

  const REINCARNATE_UPGRADES = [
    { id: 'shikaiSpeed', name: '撃破時短ブースト', cost: 10, desc: '敵撃破時の研究時短量 +1秒', max: 20 },
    { id: 'offlineMaxTime', name: '放置時間拡張', cost: 5, desc: 'オフライン放置上限 +1時間', max: 24 }
  ];

  function init() {
    loadGame();
    calculateOfflineProgress();
    renderAll();
  }

  function switchTab(tabName) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + tabName).classList.add('active');
    event.currentTarget.classList.add('active');
  }

  function tapGuild() {
    game.gold += 1;
    updateResourcesUI();
  }

  function expandLand() {
    let cost = game.townLevel * 300;
    if (game.gold >= cost && game.townLevel < 5) {
      game.gold -= cost;
      game.townLevel++;
      renderTown();
      updateResourcesUI();
    }
  }

  function getBuildingCost(typeKey, level) {
    let baseCost = BUILDING_TYPES[typeKey].baseCost;
    let multiplier = Math.pow(1.5, level - 1);
    let cost = {};
    if (baseCost.gold) cost.gold = Math.floor(baseCost.gold * multiplier);
    if (baseCost.wood) cost.wood = Math.floor(baseCost.wood * multiplier);
    if (baseCost.stone) cost.stone = Math.floor(baseCost.stone * multiplier);
    return cost;
  }

  function formatCostText(cost) {
    let parts = [];
    if (cost.gold) parts.push(`${cost.gold}G`);
    if (cost.wood) parts.push(`${cost.wood}木`);
    if (cost.stone) parts.push(`${cost.stone}鉱`);
    return parts.join(' ');
  }

  function upgradeBuilding(slotIndex) {
    let b = game.buildings[slotIndex];
    if (!b) return;
    let nextCost = getBuildingCost(b.type, b.level + 1);

    if ((!nextCost.gold || game.gold >= nextCost.gold) &&
        (!nextCost.wood || game.wood >= nextCost.wood) &&
        (!nextCost.stone || game.stone >= nextCost.stone)) {
      if (nextCost.gold) game.gold -= nextCost.gold;
      if (nextCost.wood) game.wood -= nextCost.wood;
      if (nextCost.stone) game.stone -= nextCost.stone;

      b.level++;
      renderTown();
      updateResourcesUI();
    } else {
      alert('資源が足りません！');
    }
  }

  function getPartyAtk() {
    let base = 0;
    game.characters.forEach(c => base += c.atk);
    if (game.researches['res_atk1'] === true) base += 2;
    if (game.researches['res_atk2'] === true) base += 5;
    return base;
  }

  function attackEnemy() {
    let damage = getPartyAtk();
    game.enemyHp -= damage;
    if (game.enemyHp <= 0) defeatEnemy();
    updateBattleUI();
  }

  function defeatEnemy() {
    game.gold += game.stage * 5;
    game.soul += 1;
    let shrinkSeconds = 1 + (game.upgrades.shikaiSpeed || 0);
    advanceResearch(shrinkSeconds);

    game.stage++;
    game.enemyMaxHp = Math.floor(10 * Math.pow(1.2, game.stage - 1));
    game.enemyHp = game.enemyMaxHp;
  }

  function advanceResearch(seconds) {
    if (!game.activeResearches || game.activeResearches.length === 0) return;
    game.activeResearches.forEach(resId => {
      if (game.researches[resId] !== true) {
        if (!game.researches[resId]) game.researches[resId] = 0;
        game.researches[resId] += seconds;
        let target = RESEARCH_DATA.find(r => r.id === resId).time;
        if (game.researches[resId] >= target) {
          game.researches[resId] = true;
          game.activeResearches = game.activeResearches.filter(id => id !== resId);
        }
      }
    });
    renderResearch();
  }

  function startResearch(id) {
    let maxSlots = 1;
    if (game.researches['res_slot1'] === true) maxSlots++;
    if (game.activeResearches.length >= maxSlots) {
      alert('研究スロットが埋まっています！');
      return;
    }
    let resDef = RESEARCH_DATA.find(r => r.id === id);
    if (resDef.cost.gold && game.gold < resDef.cost.gold) return;
    if (resDef.cost.stone && game.stone < resDef.cost.stone) return;

    if (resDef.cost.gold) game.gold -= resDef.cost.gold;
    if (resDef.cost.stone) game.stone -= resDef.cost.stone;

    game.researches[id] = 1;
    game.activeResearches.push(id);
    renderResearch();
    updateResourcesUI();
  }

  function pullGacha() {
    if (game.soul < 100) {
      alert('ソウルが足りません！ (必要: 100)');
      return;
    }
    game.soul -= 100;
    let template = GACHA_POOL[Math.floor(Math.random() * GACHA_POOL.length)];
    let newChar = { id: 'char_' + Date.now(), name: template.name, atk: template.atk, owned: true };
    game.characters.push(newChar);
    renderGacha();
    updateResourcesUI();
    updateBattleUI();
  }

  function reincarnate() {
    let gainedPt = Math.floor(game.gold / 1000) + 5;
    if (confirm(`転生しますか？\n・獲得予定Pt: ${gainedPt} Pt\n※進行度はリセットされます。`)) {
      game.reincarnatePoints += gainedPt;
      game.gold = 0;
      game.wood = 0;
      game.stone = 0;
      game.stage = 1;
      game.enemyMaxHp = 10;
      game.enemyHp = 10;
      game.townLevel = 3;
      game.buildings = {};
      game.researches = {};
      game.activeResearches = [];
      renderAll();
      alert('転生が完了しました！');
    }
  }

  // 100msごとにループ実行
  setInterval(() => {
    // 1. 資源の自動生成（1/10秒ぶん）
    let goldGen = 0, woodGen = 0, stoneGen = 0;
    for (let pos in game.buildings) {
      let b = game.buildings[pos];
      let def = BUILDING_TYPES[b.type];
      if (def.goldGen) goldGen += def.goldGen * b.level;
      if (def.woodGen) woodGen += def.woodGen * b.level;
      if (def.stoneGen) stoneGen += def.stoneGen * b.level;
    }
    game.gold += goldGen / 10;
    game.wood += woodGen / 10;
    game.stone += stoneGen / 10;

    // 2. ★時間経過による研究進行（100ms = 0.1秒ずつ進行）
    advanceResearch(0.1);

    updateResourcesUI();
  }, 100);

  function saveGame() {
    game.lastSaveTime = Date.now();
    localStorage.setItem('dungeonTownSave', JSON.stringify(game));
    alert('セーブしました！');
  }

  function loadGame() {
    let saved = localStorage.getItem('dungeonTownSave');
    if (saved) {
      try { game = Object.assign(game, JSON.parse(saved)); } catch(e){}
    }
  }

  function calculateOfflineProgress() {
    let now = Date.now();
    let diffSeconds = Math.floor((now - game.lastSaveTime) / 1000);
    let maxOffline = 3600 + (game.upgrades.offlineMaxTime || 0) * 3600;
    if (diffSeconds > maxOffline) diffSeconds = maxOffline;
    if (diffSeconds > 10) {
      // 放置中の生産資材加算
      let goldGen = 0, woodGen = 0, stoneGen = 0;
      for (let pos in game.buildings) {
        let b = game.buildings[pos];
        let def = BUILDING_TYPES[b.type];
        if (def.goldGen) goldGen += def.goldGen * b.level;
        if (def.woodGen) woodGen += def.woodGen * b.level;
        if (def.stoneGen) stoneGen += def.stoneGen * b.level;
      }
      game.gold += goldGen * diffSeconds;
      game.wood += woodGen * diffSeconds;
      game.stone += stoneGen * diffSeconds;

      // ★放置中の時間経過による研究進行
      advanceResearch(diffSeconds);
    }
  }

  function resetGame() {
    if (confirm('データを完全に消去しますか？')) {
      localStorage.removeItem('dungeonTownSave');
      location.reload();
    }
  }

  function updateResourcesUI() {
    document.getElementById('res-gold').innerText = Math.floor(game.gold).toLocaleString();
    document.getElementById('res-wood').innerText = Math.floor(game.wood).toLocaleString();
    document.getElementById('res-stone').innerText = Math.floor(game.stone).toLocaleString();
    document.getElementById('res-soul').innerText = Math.floor(game.soul).toLocaleString();
    document.getElementById('pending-reincarnate-pt').innerText = Math.floor(game.gold / 1000) + 5;
  }

  function updateBattleUI() {
    document.getElementById('stage-info').innerText = `ステージ ${game.stage}`;
    document.getElementById('enemy-hp').innerText = game.enemyHp;
    document.getElementById('enemy-max-hp').innerText = game.enemyMaxHp;
    let percent = Math.max(0, (game.enemyHp / game.enemyMaxHp) * 100);
    document.getElementById('enemy-hp-fill').style.width = percent + '%';
    document.getElementById('battle-atk').innerText = getPartyAtk();
    document.getElementById('stat-shikantime').innerText = 1 + (game.upgrades.shikaiSpeed || 0);
  }

  function renderTown() {
    document.getElementById('town-size').innerText = game.townLevel;
    document.getElementById('town-size-2').innerText = game.townLevel;
    document.getElementById('land-cost').innerText = game.townLevel * 300;
    
    let gridContainer = document.getElementById('town-grid');
    gridContainer.innerHTML = '';
    gridContainer.style.gridTemplateColumns = `repeat(${game.townLevel}, 1fr)`;

    let totalSlots = game.townLevel * game.townLevel;
    for (let i = 0; i < totalSlots; i++) {
      let slotEl = document.createElement('div');
      slotEl.className = 'building-slot';
      let b = game.buildings[i];
      if (b) {
        slotEl.classList.add('built');
        let def = BUILDING_TYPES[b.type];
        let nextCost = getBuildingCost(b.type, b.level + 1);
        let curOutput = (def.goldGen || def.woodGen || def.stoneGen || 1) * b.level;
        
        slotEl.innerHTML = `
          <div><strong>${def.name}</strong> <span style="font-size:0.75rem; color:var(--gold);">Lv.${b.level}</span></div>
          <div style="font-size:0.7rem; color:var(--text-sub);">効果: +${curOutput} ${def.unit}</div>
          <button onclick="upgradeBuilding(${i})" style="margin-top:4px;">LvUP (${formatCostText(nextCost)})</button>
        `;
      } else {
        slotEl.innerHTML = `<span style="font-size:0.8rem; color:var(--text-sub);">＋ 建設</span>`;
        slotEl.onclick = () => openBuildMenu(i);
      }
      gridContainer.appendChild(slotEl);
    }
  }

  function openBuildMenu(slotIndex) {
    let typeKey = prompt('建設する建物を選択してください:\n- gold_mine (金鉱: 50G)\n- lumber_mill (伐採所: 100G)\n- quarry (採掘所: 200G 50木)\n- lab (研究所: 500G 100鉱)', 'gold_mine');
    if (BUILDING_TYPES[typeKey]) {
      let cost = getBuildingCost(typeKey, 1);
      if ((!cost.gold || game.gold >= cost.gold) &&
          (!cost.wood || game.wood >= cost.wood) &&
          (!cost.stone || game.stone >= cost.stone)) {
        if (cost.gold) game.gold -= cost.gold;
        if (cost.wood) game.wood -= cost.wood;
        if (cost.stone) game.stone -= cost.stone;

        game.buildings[slotIndex] = { type: typeKey, level: 1 };
        renderTown();
        updateResourcesUI();
      } else {
        alert('資源が足りません！');
      }
    }
  }

  function renderResearch() {
    let container = document.getElementById('research-list');
    container.innerHTML = '';
    let maxSlots = 1 + (game.researches['res_slot1'] === true ? 1 : 0);
    document.getElementById('research-slots').innerText = game.activeResearches.length;
    document.getElementById('research-max-slots').innerText = maxSlots;

    RESEARCH_DATA.forEach(res => {
      let status = game.researches[res.id];
      let costText = formatCostText(res.cost);
      let html = `<div class="list-item"><div><strong>${res.name}</strong> <span style="color:var(--gold);">(${res.desc})</span><br><span style="font-size:0.75rem; color:var(--text-sub);">コスト: ${costText} | 時間: ${res.time}秒</span></div>`;
      if (status === true) {
        html += `<span style="color:#2ecc71; font-weight:bold;">完了済</span>`;
      } else if (status > 0) {
        html += `<span>進行中 (${Math.floor(status)}/${res.time}s)</span>`;
      } else {
        html += `<button onclick="startResearch('${res.id}')">研究開始</button>`;
      }
      html += `</div>`;
      container.innerHTML += html;
    });
  }

  function renderGacha() {
    let listEl = document.getElementById('owned-char-list');
    listEl.innerHTML = '';
    game.characters.forEach(c => {
      listEl.innerHTML += `<div class="list-item"><div><strong>${c.name}</strong></div><div>攻撃力: +${c.atk}</div></div>`;
    });
  }

  function renderReincarnate() {
    let container = document.getElementById('reincarnate-upgrades');
    container.innerHTML = `<div style="margin-bottom:8px;">所持転生Pt: <b>${game.reincarnatePoints}</b> Pt</div>`;
    REINCARNATE_UPGRADES.forEach(up => {
      let currentVal = game.upgrades[up.id] || 0;
      container.innerHTML += `
        <div class="list-item">
          <div>
            <strong>${up.name}</strong> (Lv.${currentVal}/${up.max})<br>
            <span style="font-size:0.75rem; color:var(--text-sub);">${up.desc}</span>
          </div>
          <button onclick="buyReincarnateUpgrade('${up.id}', ${up.cost})">強化 (${up.cost} Pt)</button>
        </div>
      `;
    });
  }

  function buyReincarnateUpgrade(id, cost) {
    let upDef = REINCARNATE_UPGRADES.find(u => u.id === id);
    let curLv = game.upgrades[id] || 0;
    if (curLv >= upDef.max) {
      alert('すでにレベルMAXです！');
      return;
    }
    if (game.reincarnatePoints >= cost) {
      game.reincarnatePoints -= cost;
      game.upgrades[id] = curLv + 1;
      renderReincarnate();
      updateBattleUI();
    } else {
      alert('転生Ptが足りません！');
    }
  }

  function renderAll() {
    updateResourcesUI();
    updateBattleUI();
    renderTown();
    renderResearch();
    renderGacha();
    renderReincarnate();
  }

  init();
</script>
</body>
</html>
